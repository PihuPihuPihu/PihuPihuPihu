name: 🐱 Nyan Cat Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # regenerates every day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  nyan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install Pillow requests

      - name: Create output folder
        run: mkdir -p dist

      - name: Generate Nyan Cat GIF
        run: python generate_nyan.py ${{ github.repository_owner }} --output dist/nyan.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push GIF to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
